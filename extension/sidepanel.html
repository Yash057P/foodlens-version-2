<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodLens Side Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="sidepanel.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800 antialiased font-inter h-screen flex flex-col p-4">
  <header class="flex items-center space-x-2 mb-6 border-b pb-4">
    <div class="w-8 h-8 rounded-full bg-emerald-500 flex items-center justify-center text-white font-bold shadow-sm">
      FL
    </div>
    <h1 class="text-xl font-bold tracking-tight text-slate-900">FoodLens AI</h1>
  </header>

  <main class="flex-grow flex flex-col overflow-y-auto space-y-6 scrollbar-hide">
    <!-- Manual Upload Zone -->
    <div id="upload-zone" class="border-2 border-dashed border-slate-300 rounded-xl p-6 flex flex-col items-center justify-center text-center bg-white hover:bg-slate-50 transition cursor-pointer relative group">
      <input type="file" id="file-input" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" accept="image/jpeg, image/png">
      <svg class="w-8 h-8 text-emerald-500 mb-2 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
      <p class="text-sm font-medium text-slate-700">Click or drop an image</p>
      <p class="text-xs text-slate-400 mt-1">Or right-click any image on the web</p>
    </div>

    <!-- Preview Image -->
    <div id="preview-container" class="hidden rounded-xl overflow-hidden shadow-sm border border-slate-200 bg-white">
      <img id="preview-img" src="" alt="Preview" class="w-full h-48 object-cover object-center">
    </div>

    <!-- Loading State -->
    <div id="loading-state" class="hidden flex-col items-center justify-center py-8">
      <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-emerald-500 mb-3"></div>
      <p class="text-sm text-slate-500 font-medium">Analyzing food...</p>
    </div>

    <!-- Error State -->
    <div id="error-state" class="hidden p-4 rounded-xl bg-red-50 text-red-600 border border-red-100 text-sm">
      <p class="font-semibold mb-1">Error</p>
      <p id="error-message">Could not connect to the server.</p>
    </div>

    <!-- Warnings -->
    <div id="warnings-container" class="hidden space-y-2"></div>

    <!-- Results State -->
    <div id="results-state" class="hidden space-y-4">
      
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4">
        <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Top Prediction</h2>
        <div class="flex items-end justify-between mb-1">
          <h3 id="lead-name" class="text-2xl font-bold text-slate-900 leading-none"></h3>
          <span id="lead-prob" class="text-sm font-semibold text-emerald-600 bg-emerald-50 px-2 py-1 rounded-md"></span>
        </div>
      </div>

      <div id="nutrition-card" class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 hidden">
        <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Nutrition & Info</h2>
        <div class="grid grid-cols-2 gap-3 mb-3">
          <div class="bg-slate-50 rounded-lg p-3">
            <p class="text-xs text-slate-500 mb-1">Calories</p>
            <p id="calories-val" class="text-lg font-bold text-slate-800">--</p>
          </div>
          <div class="bg-slate-50 rounded-lg p-3">
            <p class="text-xs text-slate-500 mb-1">Allergens</p>
            <div id="allergens-val" class="flex flex-wrap gap-1"></div>
          </div>
        </div>
        <div>
          <p class="text-xs text-slate-500 mb-1">Common Ingredients</p>
          <p id="ingredients-val" class="text-sm text-slate-700 leading-relaxed"></p>
        </div>
      </div>

      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4">
        <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Alternatives</h2>
        <div id="alt-predictions" class="space-y-3"></div>
      </div>

    </div>
  </main>
  
  <footer class="mt-4 pt-4 border-t border-slate-200 text-center">
    <p class="text-[10px] text-slate-400">Nutritional values are estimates and not medical advice.</p>
  </footer>

  <script src="sidepanel.js"></script>
</body>
</html>
